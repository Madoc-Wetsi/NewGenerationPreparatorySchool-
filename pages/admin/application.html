<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./css/application.css">
  </head>
  <body>
    <aside class="side-bar">
      <div class="head"></div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="application.html">Applications</a>
        <a href="message.html">Message</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Settings</a>
        <a href="profile.html">Profile</a>
      </nav>

      <div class="btn">
        <button class="logout-btn" type="button">Logout</button>
        <i class="fa fa-logout"></i>
      </div>
    </aside>

    <main>
      <div class="header">
        <div class="right-section">
          <h2>Application</h2>
          <br>
          <p>Review and manage applications </p>
        </div>
        <div class="left-section">
          <div class="bell"><i class="fa fa-bell"></i></div>
          <div class="profile"><h1>A</h1></div>
        </div>
      </div>
      <div class="content">
        <div class="application-tools">
          <input type="text" placeholder="search applicant...">
          <select name="" id="">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="rejected">Rejected</option>
            <option value="approved">Approved</option>
            <option value="enrolled">Enrolled</option>
            <option value="review">Under Review</option>
          </select>
        </div>

        <div class="application-table">
          <table>
            <thead>
              <tr>
                <th>Applicant</th>
                <th>Class</th>
                <th>Date Applied</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>John Mensah</td>
                <td>Basic 5</td>
                <td>Oct 1, 2026</td>
                <td>
                  <span class="status pending">Pending</span>
                </td>
                <td>
                  <button class="view-btn">View</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </body>
</html>
